# WildGuard local broker (Mosquitto 2.x). Start with:  mosquitto -c broker/mosquitto.conf -v
# LAN only: laptop (PipeGen, bridge, backend) + ESP32 on the same travel router / hotspot.

# MQTT for PipeGen, bridge, backend and the ESP32
listener 1883 0.0.0.0
protocol mqtt

# Demo setting: anonymous access on an isolated LAN. For anything beyond the venue,
# set allow_anonymous false and add: password_file broker/passwd  (mosquitto_passwd -c broker/passwd wildguard)
allow_anonymous true

# Keep retained status/mode across broker restarts (WG-CON-02, control/mode)
persistence true
persistence_location /tmp/wildguard-mosquitto/

# ESP32 payloads are < 256 B; reject anything silly
max_packet_size 65536
max_queued_messages 1000

log_type error
log_type warning
log_type notice
connection_messages true
